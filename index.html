<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>売上管理ダッシュボード</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>売上管理ダッシュボード</h1>
      <p>売上データを登録・検索・集計・可視化できる業務改善ツール</p>
    </header>
  <p id="messageArea" class="message-area"></p>  

    <section class="form-section">
      <h2>売上登録</h2>
      <form id="salesForm">
        <div class="form-grid">
          <div class="form-group">
            <label for="date">日付</label>
            <input type="date" id="date" required>
          </div>

          <div class="form-group">
            <label for="product">商品名</label>
            <input type="text" id="product" placeholder="例：りんご" required>
          </div>

          <div class="form-group">
            <label for="amount">売上金額</label>
            <input type="number" id="amount" placeholder="例：1200" min="0" required>
          </div>

          <div class="form-group">
            <label for="category">カテゴリ</label>
            <select id="category" required>
              <option value="">選択してください</option>
              <option value="食品">食品</option>
              <option value="日用品">日用品</option>
              <option value="雑貨">雑貨</option>
              <option value="その他">その他</option>
            </select>
          </div>
        </div>

        <button type="submit" class="add-button">登録する</button>
      </form>
      <div class="action-buttons">
  <button type="button" id="sampleDataButton" class="sample-button">
    サンプルデータ投入
  </button>
  <button type="button" id="clearAllButton" class="clear-all-button">
    全データ削除
  </button>
</div>
    </section>

    <section class="filter-section">
      <h2>検索・絞り込み</h2>
      <div class="filter-box">
        <input type="text" id="searchInput" placeholder="商品名で検索">
        <select id="categoryFilter">
          <option value="all">すべてのカテゴリ</option>
          <option value="食品">食品</option>
          <option value="日用品">日用品</option>
          <option value="雑貨">雑貨</option>
          <option value="その他">その他</option>
        </select>
        <button id="resetButton" type="button">全件表示</button>
      </div>
      <div class="export-area">
  <button id="exportCsvButton" type="button" class="export-button">
    CSV出力
  </button>
</div>
    </section>

    <section class="summary-section">
      <h2>売上集計</h2>
      <div class="summary-cards">
        <div class="summary-card">
          <h3>登録件数</h3>
          <p id="totalCount">0件</p>
        </div>
        <div class="summary-card">
          <h3>総売上</h3>
          <p id="totalSales">¥0</p>
        </div>
        <div class="summary-card">
          <h3>平均売上</h3>
          <p id="averageSales">¥0</p>
        </div>
      </div>
    </section>

    <section class="list-section">
      <h2>売上一覧</h2>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>日付</th>
              <th>商品名</th>
              <th>売上金額</th>
              <th>カテゴリ</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="salesList"></tbody>
        </table>
      </div>
    </section>

    <section class="chart-section">
      <h2>売上グラフ</h2>
      <div class="chart-grid">
        <div class="chart-card">
          <h3>日別売上</h3>
          <canvas id="dailySalesChart"></canvas>
        </div>

        <div class="chart-card">
          <h3>カテゴリ別売上</h3>
          <canvas id="categorySalesChart"></canvas>
        </div>
      </div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="script.js"></script>
</body>
</html>
